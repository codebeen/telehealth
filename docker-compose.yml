services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    container_name: db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-telehealth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-telehealth}
      POSTGRES_DB: ${POSTGRES_DB:-telehealth}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-telehealth} -d $${POSTGRES_DB:-telehealth}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    container_name: telehealth_backend
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-telehealth}:${POSTGRES_PASSWORD:-telehealth}@postgres:5432/${POSTGRES_DB:-telehealth}"
      PORT: 3001
      NODE_ENV: development
    ports:
      - "3001:3001"
    volumes:
      - ./api:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "
        echo 'Waiting for database to be ready...'
        while ! nc -z postgres 5432; do
          sleep 1
        done
        echo 'Database is ready! Running migrations...'
        pnpm prisma migrate deploy
        echo 'Starting NestJS dev server...'
        pnpm run start:dev
      "

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    container_name: telehealth_frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: 1000
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  db_data:
